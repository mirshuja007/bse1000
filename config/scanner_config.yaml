# ---------------------------------------------------------------------------
# BSE 1000 Momentum Scanner - configuration
#
# Every value here can also be overridden live from the Streamlit sidebar.
# Edit this file to change the defaults the app boots with.
# ---------------------------------------------------------------------------

universe:
  constituents_file: "data/bse_1000_constituents.csv"
  mapping_file: "data/universe_mapping.csv"     # generated by src/instruments.py, gitignored
  exclude_symbols: []                            # BSE codes to always skip (e.g. suspended scrips)

data:
  history_days: 400          # calendar days of daily OHLCV to pull (need 200DMA + warmup buffer)
  benchmark_index: "NSE:NIFTY 500"   # used for relative-strength calculations
  cache_dir: ".cache/ohlcv"
  cache_ttl_hours: 6         # reuse cached bars within a trading day instead of re-hitting the API
  max_requests_per_second: 2.5   # stay under Kite's historical-data limit (3/sec)

# ---------------------------------------------------------------------------
# Screening filters - a stock must pass ALL enabled filters to become a
# scanner candidate. Set `enabled: false` on any block to skip that filter.
# ---------------------------------------------------------------------------
filters:
  liquidity:
    enabled: true
    min_price: 20                 # avoid penny stocks
    min_avg_turnover_cr: 3         # 20-day avg daily turnover, INR crore
    turnover_lookback: 20

  volume:
    enabled: true
    surge_multiplier: 1.5          # today's volume vs avg volume over lookback
    lookback: 20

  dma50_breakout:
    enabled: true
    lookback_days: 5               # price crossed above 50DMA within last N sessions
    min_pct_above: 0.0             # require price at least X% above the 50DMA right now

  dma200_breakout:
    enabled: false                 # off by default; turn on to hunt long-base breakouts
    lookback_days: 10
    min_pct_above: 0.0

  rsi:
    enabled: true
    period: 14
    min_rsi: 60                    # "momentum" floor
    max_rsi: 100                   # set to e.g. 80 to exclude the most extended names
    flag_above: 70                  # values above this are tagged "overbought" in the UI

  donchian_breakout:
    enabled: true
    period: 20                     # N-day high breakout (classic turtle-style trigger)

  trend_filter:
    enabled: true
    require_50_above_200: true     # "golden cross" regime
    require_price_above_50: true
    require_price_above_200: true

  adx:
    enabled: true
    period: 14
    min_adx: 20                    # trend strength floor

  supertrend:
    enabled: true
    period: 10                     # ATR period (standard default across platforms)
    multiplier: 3.0                # ATR multiplier - lower = more reactive/more signals
    flip_lookback_days: 3          # only count a red->green flip within this many days as a fresh trigger

# ---------------------------------------------------------------------------
# Conviction scoring - weighted, transparent, fully rule-based (no black-box
# ML claims). Category weights must sum to 100. Each category score is 0-100
# internally; the final conviction score is the weighted average.
# ---------------------------------------------------------------------------
conviction:
  weights:
    trend: 20            # 50/200 DMA structure & slope
    momentum: 20          # RSI zone, MACD, rate of change
    volume: 15            # volume surge, OBV trend
    breakout_quality: 20   # Donchian breakout, distance from pivot, volatility contraction
    relative_strength: 15  # vs benchmark index
    sector_strength: 10    # sector-level breadth/momentum

  extended_penalty:
    enabled: true
    pct_above_pivot_threshold: 12   # % above breakout pivot considered "chased"
    penalty_points: 15

  rsi_overbought_penalty:
    enabled: true
    threshold: 82
    penalty_points: 10

  tiers:                 # inclusive lower bounds
    very_high_conviction: 75
    high_conviction: 60
    moderate_conviction: 45
    watchlist: 0

  # Horizon this whole model is tuned for. Not used in the math directly, but
  # documents the intent and drives default lookbacks above.
  target_horizon_days: [1, 15]

# ---------------------------------------------------------------------------
# Suggested risk levels, shown per stock alongside the conviction score.
# ATR-based stop/target is a standard volatility-adjusted approach: the stop
# sits stop_multiplier ATRs below the close, the target sits target_multiplier
# ATRs above it. Default is a 2:1 reward:risk ratio. This is a suggestion,
# not a recommendation to size or place any specific trade.
# ---------------------------------------------------------------------------
risk:
  atr_stop_multiplier: 1.5
  atr_target_multiplier: 3.0
